name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax check
        run: bash -n debian-security-check.sh install.sh
      - name: ShellCheck
        run: shellcheck --severity=warning debian-security-check.sh install.sh
      - name: Help smoke test
        run: bash debian-security-check.sh --help
      - name: Version smoke test
        run: |
          test "$(bash debian-security-check.sh --version)" = "1.2.4"
          grep -q 'RELEASE_TAG="v1.2.4"' install.sh
      - name: Interactive menu exit smoke test
        run: |
          printf '0\n' | script -qec 'bash debian-security-check.sh' /dev/null | grep -q '已退出，没有修改系统'
      - name: Reject unsafe option combination
        run: |
          set +e
          bash debian-security-check.sh --fix --no-refresh
          status=$?
          set -e
          test "$status" -eq 2

  debian-smoke:
    name: Debian ${{ matrix.release }} smoke test
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["12", "13"]
    steps:
      - uses: actions/checkout@v5
      - name: Run non-mutating system check
        shell: bash
        run: |
          set +e
          output="$(bash debian-security-check.sh --check --no-refresh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ge 0
          test "$status" -le 2
          grep -q "Debian GNU/Linux ${{ matrix.release }}" <<<"$output"
          grep -q '== 下一步 ==' <<<"$output"
