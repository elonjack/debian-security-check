name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n debian-security-check.sh
      - name: ShellCheck
        run: shellcheck --severity=warning debian-security-check.sh
