name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax check
        run: bash -n debian-security-check.sh install.sh
      - name: ShellCheck
        run: shellcheck --severity=warning debian-security-check.sh install.sh
      - name: Help smoke test
        run: bash debian-security-check.sh --help
      - name: Version smoke test
        run: |
          test "$(bash debian-security-check.sh --version)" = "1.5.0"
          grep -q 'RELEASE_TAG="v1.5.0"' install.sh
      - name: Safety self-test
        run: bash debian-security-check.sh --self-test
      - name: Interactive menu exit smoke test
        run: |
          menu_output="$(printf '0\n' | script -qec 'bash debian-security-check.sh' /dev/null)"
          grep -q '1) 智能检查并修复' <<<"$menu_output"
          grep -q '2) 自动安全更新设置' <<<"$menu_output"
          grep -q '3) 旧内核安全清理' <<<"$menu_output"
          grep -q '请选择 \[1/2/3/0\]' <<<"$menu_output"
          grep -q '已退出，没有修改系统' <<<"$menu_output"
          grep -Fq $'\033[33m  1) 智能检查并修复（有更新才安装，需要时自动重启）\033[0m' <<<"$menu_output"
          grep -Fq $'\033[33m  2) 自动安全更新设置（长期生效，默认不会自动开启）\033[0m' <<<"$menu_output"
          grep -Fq $'\033[33m  3) 旧内核安全清理（默认关闭，始终保留当前和一个备用）\033[0m' <<<"$menu_output"
          grep -Fq $'\033[33m  0) 退出\033[0m' <<<"$menu_output"
      - name: Kernel cleanup submenu smoke test
        run: |
          menu_output="$(printf '3\n0\n0\n' | script -qec 'bash debian-security-check.sh' /dev/null)"
          grep -q '旧内核安全清理（默认关闭）' <<<"$menu_output"
          grep -q '1) 查看可清理的旧内核' <<<"$menu_output"
          grep -q '2) 立即安全清理一次' <<<"$menu_output"
          grep -q '3) 开启每周自动检查和清理' <<<"$menu_output"
          grep -q '请选择 \[1/2/3/4/5/0\]' <<<"$menu_output"
      - name: Reject unsafe option combination
        run: |
          set +e
          bash debian-security-check.sh --fix --no-refresh
          status=$?
          set -e
          test "$status" -eq 2

  debian-smoke:
    name: Debian ${{ matrix.release }} smoke test
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["12", "13"]
    steps:
      - uses: actions/checkout@v5
      - name: Run non-mutating system check
        shell: bash
        run: |
          bash debian-security-check.sh --self-test
          set +e
          output="$(bash debian-security-check.sh --check --no-refresh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ge 0
          test "$status" -le 2
          grep -q "Debian GNU/Linux ${{ matrix.release }}" <<<"$output"
          grep -q '== 下一步 ==' <<<"$output"
